<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>巡查 · 农场派单</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --line: #2a3542;
      --text: #e8eef4;
      --muted: #8b9aab;
      --ok: #3dba7a;
      --warn: #e6a23c;
      --err: #e85d5d;
      --acc: #4da3ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      background: radial-gradient(120% 80% at 50% -10%, #1a2a3a 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100dvh;
      padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
    }
    h1 { font-size: 1.15rem; margin: 0 0 4px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    .badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .b-err { background: rgba(232,93,93,.2); color: #ffb4b4; }
    .b-fin { background: rgba(61,186,122,.2); color: #9eecc0; }
    .b-mnt { background: rgba(230,162,60,.2); color: #ffd59a; }
    .b-idle { background: rgba(77,163,255,.15); color: #a8d2ff; }
    .name { font-weight: 600; font-size: 0.95rem; }
    .meta { color: var(--muted); font-size: 0.75rem; margin-top: 4px; line-height: 1.4; }
    .swatch {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.35); display: inline-block; vertical-align: middle;
    }
    button, .btn {
      appearance: none; border: 0; border-radius: 10px;
      padding: 10px 12px; font-size: 0.85rem; font-weight: 600;
      background: var(--acc); color: #061018; cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button.danger { background: var(--err); color: #fff; }
    button.warn { background: var(--warn); color: #1a1200; }
    button.ok { background: var(--ok); color: #04140c; }
    button:disabled { opacity: .45; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: #121820; color: var(--text);
      font-size: 16px; margin: 6px 0 10px;
    }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
    .tab {
      flex: 0 0 auto; padding: 8px 12px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 0.8rem;
    }
    .tab.on { background: #243041; color: var(--text); border-color: #3a4d63; }
    .login-box { max-width: 420px; margin: 12vh auto 0; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: #243041; color: #fff; padding: 10px 16px; border-radius: 999px;
      font-size: 0.85rem; z-index: 50; opacity: 0; transition: .2s;
      pointer-events: none; max-width: 90vw;
    }
    .toast.show { opacity: 1; }
    .sheet {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40;
      display: none; align-items: flex-end; justify-content: center;
    }
    .sheet.on { display: flex; }
    .sheet-body {
      width: 100%; max-width: 560px; background: #16202a;
      border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: 85vh; overflow: auto;
    }
    .empty { text-align: center; color: var(--muted); padding: 28px 8px; font-size: 0.9rem; }
    .notice { border-left: 3px solid var(--warn); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <script>
(function () {
  var TOKEN_KEY = 'farm_dispatch_jwt'
  var ROLE = 'patrol'

  function $(id) { return document.getElementById(id) }
  function toast(msg) {
    var el = $('toast')
    el.textContent = msg
    el.classList.add('show')
    setTimeout(function () { el.classList.remove('show') }, 2200)
  }
  function token() { return localStorage.getItem(TOKEN_KEY) || '' }
  function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY) }

  function unwrap(j) {
    if (!j) return j
    if (j.data && typeof j.data === 'object' && (j.ok === true || j.data.ok != null || j.data.board || j.data.roles)) return j.data
    return j
  }

  async function api(method, path, body) {
    var headers = { Accept: 'application/json' }
    if (token()) headers.Authorization = 'Bearer ' + token()
    if (body != null) headers['Content-Type'] = 'application/json'
    var res = await fetch(path, { method: method, headers: headers, body: body != null ? JSON.stringify(body) : undefined })
    var j = null
    try { j = await res.json() } catch (e) { j = { ok: false, message: '响应解析失败' } }
    j = unwrap(j)
    if (!res.ok && (!j || j.ok !== false)) j = { ok: false, message: (j && j.message) || ('HTTP ' + res.status) }
    return j
  }

  async function login(username, password) {
    var res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
    var j = await res.json()
    if (!res.ok || !j.token) throw new Error((j && j.message) || '登录失败')
    setToken(j.token)
    var me = await api('GET', '/api/v1/farm-dispatch/me')
    if (!me || !me.ok || !me.roles || !me.roles.patrol) {
      setToken('')
      throw new Error('该账号不是巡查岗，请联系管理员加入「巡查」用户组')
    }
    return me
  }

  var state = { me: null, board: null, tab: 'error', device: null, spools: [] }

  function renderLogin() {
    $('app').innerHTML =
      '<div class="login-box card">' +
      '<h1>巡查登录</h1>' +
      '<div class="sub">仅「巡查」用户组可进入手机巡查页</div>' +
      '<label>账号</label><input id="u" autocomplete="username" />' +
      '<label>密码</label><input id="p" type="password" autocomplete="current-password" />' +
      '<button id="go" style="width:100%">登录</button>' +
      '</div>'
    $('go').onclick = async function () {
      try {
        $('go').disabled = true
        state.me = await login($('u').value.trim(), $('p').value)
        await loadBoard()
      } catch (e) {
        toast(e.message || String(e))
      } finally {
        $('go').disabled = false
      }
    }
  }

  function boardList(key) {
    var b = state.board || {}
    return b[key] || []
  }

  function render() {
    if (!state.me) return renderLogin()
    var tabs = [
      { id: 'error', label: '报错', n: boardList('error').length },
      { id: 'finished', label: '完成', n: boardList('finished').length },
      { id: 'attention', label: '待处理', n: boardList('attention').length },
      { id: 'maintenance', label: '维修', n: boardList('maintenance').length },
      { id: 'notices', label: '通知', n: (state.notices || []).length },
      { id: 'idle', label: '空闲', n: boardList('idle').length }
    ]
    var html =
      '<div class="row" style="margin-bottom:10px">' +
      '<div><h1>巡查看板</h1><div class="sub">' +
      (state.me.user.displayName || state.me.user.username) +
      ' · 点设备可设空闲/维修/绑耗材</div></div>' +
      '<button class="ghost" id="logout">退出</button></div>' +
      '<div class="tabs">' +
      tabs.map(function (t) {
        return '<button class="tab' + (state.tab === t.id ? ' on' : '') + '" data-tab="' + t.id + '">' +
          t.label + (t.n ? ' ' + t.n : '') + '</button>'
      }).join('') +
      '</div><div id="list"></div><div id="sheet" class="sheet"></div>'

    $('app').innerHTML = html
    $('logout').onclick = function () { setToken(''); state.me = null; renderLogin() }
    Array.prototype.forEach.call(document.querySelectorAll('[data-tab]'), function (el) {
      el.onclick = function () { state.tab = el.getAttribute('data-tab'); render() }
    })
    renderList()
  }

  function deviceCard(d) {
    var badge =
      d.board === 'error' ? 'b-err' :
      d.board === 'finished' ? 'b-fin' :
      d.board === 'maintenance' ? 'b-mnt' : 'b-idle'
    var label =
      d.board === 'error' ? '报错' :
      d.board === 'finished' ? '完成' :
      d.board === 'maintenance' ? '维修' :
      d.board === 'attention' ? '待处理' :
      d.board === 'printing' ? '打印中' : '空闲'
    var bound = (d.bound || []).map(function (b) {
      return '<span class="swatch" style="background:' + (b.colorHex || '#888') + '"></span> ' +
        (b.material || '') + ' ' + (b.color || '')
    }).join(' · ') || '未绑定耗材'
    return (
      '<div class="card" data-dev="' + d.id + '">' +
      '<div class="row"><div class="name">' + esc(d.name) + '</div><span class="badge ' + badge + '">' + label + '</span></div>' +
      '<div class="meta">机型 ' + esc(d.model || '未知') + ' · ' + esc(d.state || d.health || '') +
      (d.filename ? '<br>文件 ' + esc(d.filename) : '') +
      (d.message ? '<br>' + esc(d.message) : '') +
      '<br>耗材：' + bound + '</div></div>'
    )
  }

  function renderList() {
    var box = $('list')
    if (state.tab === 'notices') {
      var ns = state.notices || []
      if (!ns.length) { box.innerHTML = '<div class="empty">暂无待办通知</div>'; return }
      box.innerHTML = ns.map(function (n) {
        return '<div class="card notice" data-notice="' + n.id + '" data-job="' + (n.jobId || '') + '">' +
          '<div class="name">' + esc(n.title) + '</div>' +
          '<div class="meta">' + esc(n.body) + '</div>' +
          '<button class="ok" style="margin-top:10px;width:100%" data-act="notice-done">换好了 / 确认并重新派单</button></div>'
      }).join('')
      Array.prototype.forEach.call(box.querySelectorAll('[data-act=notice-done]'), function (btn) {
        btn.onclick = async function (ev) {
          ev.stopPropagation()
          var card = btn.closest('[data-notice]')
          btn.disabled = true
          var j = await api('POST', '/api/v1/farm-dispatch/patrol/notice-done', {
            noticeId: card.getAttribute('data-notice'),
            jobId: card.getAttribute('data-job') || undefined
          })
          toast(j.ok ? '已确认' : (j.message || '失败'))
          await loadBoard()
        }
      })
      return
    }
    var list = boardList(state.tab)
    if (!list.length) { box.innerHTML = '<div class="empty">这一栏暂无设备</div>'; return }
    box.innerHTML = list.map(deviceCard).join('')
    Array.prototype.forEach.call(box.querySelectorAll('[data-dev]'), function (el) {
      el.onclick = function () { openSheet(el.getAttribute('data-dev')) }
    })
  }

  function findDevice(id) {
    var all = (state.devices || [])
    for (var i = 0; i < all.length; i++) if (String(all[i].id) === String(id)) return all[i]
    return null
  }

  function openSheet(id) {
    var d = findDevice(id)
    if (!d) return
    state.device = d
    var sheet = $('sheet')
    var opts = (state.spools || []).map(function (s) {
      return '<option value="' + esc(s.id) + '">' + esc((s.material || '') + ' / ' + (s.color || '') + ' · 余' + (s.remainGrams != null ? s.remainGrams + 'g' : '?')) + '</option>'
    }).join('')
    sheet.className = 'sheet on'
    sheet.innerHTML =
      '<div class="sheet-body">' +
      '<div class="row"><div class="name">' + esc(d.name) + '</div><button class="ghost" id="close">关闭</button></div>' +
      '<div class="meta" style="margin:8px 0 12px">机型 ' + esc(d.model || '未知') + '</div>' +
      '<div class="row" style="gap:8px;margin-bottom:12px">' +
      '<button class="ok" style="flex:1" id="setIdle">设为空闲</button>' +
      '<button class="warn" style="flex:1" id="setMnt">设为维修</button></div>' +
      '<label>绑定耗材（耗材管理）</label>' +
      '<select id="spool"><option value="">选择料卷…</option>' + opts + '</select>' +
      '<label>槽位（0=外挂，≥1=AMS）</label><input id="slot" type="number" value="0" min="0" />' +
      '<button style="width:100%" id="bind">绑定到本机</button>' +
      (d.bound && d.bound.length
        ? '<div class="meta" style="margin-top:12px">当前绑定：</div>' +
          d.bound.map(function (b) {
            return '<div class="row card" style="margin-top:6px"><div class="meta">' +
              esc(b.material + ' ' + b.color) + ' · 槽' + b.slotId +
              '</div><button class="ghost danger" data-unbind="' + esc(b.spoolId) + '" data-slot="' + b.slotId + '">解绑</button></div>'
          }).join('')
        : '') +
      '</div>'
    $('close').onclick = function () { sheet.className = 'sheet'; sheet.innerHTML = '' }
    sheet.onclick = function (e) { if (e.target === sheet) $('close').onclick() }
    $('setIdle').onclick = function () { setDuty('idle') }
    $('setMnt').onclick = function () { setDuty('maintenance') }
    $('bind').onclick = async function () {
      var spoolId = $('spool').value
      if (!spoolId) return toast('请选择料卷')
      var j = await api('POST', '/api/v1/farm-dispatch/patrol/bind', {
        deviceId: d.id, spoolId: spoolId, slotId: Number($('slot').value) || 0
      })
      toast(j.ok ? '已绑定' : (j.message || '绑定失败'))
      if (j.ok) await loadBoard(true)
    }
    Array.prototype.forEach.call(sheet.querySelectorAll('[data-unbind]'), function (btn) {
      btn.onclick = async function () {
        var j = await api('POST', '/api/v1/farm-dispatch/patrol/unbind', {
          deviceId: d.id,
          spoolId: btn.getAttribute('data-unbind'),
          slotId: Number(btn.getAttribute('data-slot')) || 0
        })
        toast(j.ok ? '已解绑' : (j.message || '失败'))
        if (j.ok) await loadBoard(true)
      }
    })
  }

  async function setDuty(status) {
    var d = state.device
    if (!d) return
    var j = await api('POST', '/api/v1/farm-dispatch/patrol/duty', { deviceId: d.id, status: status })
    toast(j.ok ? (status === 'idle' ? '已设为空闲' : '已设为维修') : (j.message || '失败'))
    if (j.ok) await loadBoard(true)
  }

  async function loadBoard(keepSheet) {
    var j = await api('GET', '/api/v1/farm-dispatch/patrol/board')
    if (j && j.message === '请先登录') { setToken(''); state.me = null; renderLogin(); return }
    if (!j || !j.ok) { toast((j && j.message) || '加载失败'); return }
    state.board = j.board
    state.devices = j.devices || []
    state.notices = j.notices || []
    state.spools = j.spools || []
    render()
    if (keepSheet && state.device) openSheet(state.device.id)
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
  }

  async function boot() {
    if (!token()) return renderLogin()
    try {
      var me = await api('GET', '/api/v1/farm-dispatch/me')
      if (!me || !me.ok || !me.roles || !me.roles.patrol) {
        setToken('')
        return renderLogin()
      }
      state.me = me
      await loadBoard()
      setInterval(function () { if (state.me) loadBoard(false) }, 8000)
    } catch (e) {
      setToken('')
      renderLogin()
    }
  }
  boot()
})()
  </script>
</body>
</html>
