# 飞牛别名（与 docker-compose.fnos.yml 相同）
# 用法：docker compose -f docker-compose.feiniu.yml up -d --build
# 飞牛 / 群晖 / NAS：host 网络，便于扫局域网打印机
# 用法（在 docker/ 目录）：
#   docker compose -f docker-compose.fnos.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: hanye-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hanye_root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hanye_printer}
      MYSQL_USER: ${MYSQL_USER:-hanye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hanye_pass_change_me}
    volumes:
      - hanye_mysql_data:/var/lib/mysql
      - ../ops/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD:-hanye_root_change_me}"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hanye-printer-monitor:latest
    # 不要去 Docker Hub 拉这个本地镜像名（否则会一直 app Pulling）
    pull_policy: build
    container_name: hanye-app
    restart: unless-stopped
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      USE_MYSQL: "1"
      PORT: "17890"
      DATA_ROOT: /app/data
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-hanye}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hanye_pass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hanye_printer}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-change-me-to-a-long-random-string}
      AUTO_IMPORT: ${AUTO_IMPORT:-1}
      IMPORT_FORCE: ${IMPORT_FORCE:-0}
      WAIT_MYSQL_SECONDS: ${WAIT_MYSQL_SECONDS:-120}
      LAN_SCAN_SUBNETS: ${LAN_SCAN_SUBNETS:-192.168.1}
      RUNNING_IN_DOCKER: "1"
      UPDATE_GIT_ROOT: /host-repo
    volumes:
      - ../data:/app/data
      - ..:/host-repo
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://127.0.0.1:17890/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  hanye_mysql_data:
